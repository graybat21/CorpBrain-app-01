[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corpbrain"
version = "0.9.0"
# 특정 버전의 기능을 문구에 박지 않는다 — 그러면 릴리스마다 낡는다.
# (실제로 v0.5 표식이 v0.8 까지 남아 있었다.) 제품이 무엇인지만 적는다.
description = "100% 로컬 구동형 AI 지식 관리 — 로컬 문서를 스캔·요약해 마크다운 위키·벡터 검색·지식그래프로 만든다 (클라우드 요약은 옵트인)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-docx>=1.1",  # FR-007 .docx 텍스트 추출 (이슈 명세에 명시된 의존성)
  "pypdf>=4",  # v0.2 U1 .pdf 텍스트 레이어 추출 (스펙 §4.1)
  # v0.8 U1 오피스 포맷 추출 (스펙 §4.6). extras 로 분리하지 않고 **필수 런타임 의존성**으로 둔다 —
  # 선택 의존성으로 두면 「미설치 = 미지원 확장자인가, 추출 실패인가」 판정이 하나 늘고, 같은 폴더가
  # 설치 상태에 따라 다른 개수의 위키를 내게 된다. 위 두 줄의 관행을 그대로 따른다.
  "openpyxl>=3.1.5",  # .xlsx/.xlsm 텍스트 추출 (스펙 §4.2)
  "python-pptx>=1.0.2",  # .pptx 텍스트 추출 (스펙 §4.2)
]

[project.scripts]
corpbrain = "corpbrain.cli:main"

# 개발 의존성은 PEP 735 그룹으로 선언한다 (uv가 기본 동기화 → `uv run pytest` / `uv run ruff` 가 그대로 동작).
[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["corpbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 여러 디렉터리에 같은 파일명(test_pipeline.py 등)이 있어도 충돌하지 않게 한다.
addopts = "--import-mode=importlib"
